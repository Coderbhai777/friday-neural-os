<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JARVIS 3D Tactical Core - Quantum Orb & God's Eye View</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #061224 0%, #020712 60%, #000308 100%);
      font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e2e8f0;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      cursor: grab;
      z-index: 1;
    }
    #canvas-container:active {
      cursor: grabbing;
    }

    #godseye-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      background: #000;
      display: none;
    }

    #godseye-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                  linear-gradient(90deg, rgba(0, 240, 255, 0.02), rgba(0, 150, 255, 0.01), rgba(0, 240, 255, 0.02));
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      z-index: 4;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 45%, rgba(0, 4, 10, 0.8) 100%);
      pointer-events: none;
      z-index: 3;
    }

    /* Top Status Bar & Dual-Mode UI Switcher */
    .top-hud {
      position: absolute;
      top: 14px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .mode-switcher {
      display: flex;
      background: rgba(4, 16, 36, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 9999px;
      padding: 3px;
      gap: 4px;
      backdrop-filter: blur(14px);
      pointer-events: auto;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
    }

    .mode-btn {
      background: transparent;
      border: none;
      outline: none;
      color: #7090b0;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-btn:hover {
      color: #00f0ff;
      background: rgba(0, 240, 255, 0.08);
    }

    .mode-btn.active {
      color: #020814;
      background: linear-gradient(135deg, #00f0ff 0%, #00b4d8 100%);
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.6);
      font-weight: 800;
    }

    .hud-title-wrap {
      text-align: center;
      pointer-events: none;
    }

    .hud-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 8px;
      color: #00f0ff;
      text-shadow: 0 0 16px rgba(0, 240, 255, 0.9), 0 0 35px rgba(0, 160, 255, 0.5);
    }

    .hud-title-sub {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 3px;
      color: #00b4d8;
      margin-top: 2px;
      font-family: 'Rajdhani', sans-serif;
      text-transform: uppercase;
    }

    .top-stats {
      display: flex;
      gap: 8px;
      align-items: center;
      pointer-events: auto;
    }

    .stat-pill {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: #90e0ef;
    }
    .stat-pill.cyan {
      border-color: #00f0ff;
      color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    /* Bottom Control Hints */
    .hud-hint {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      color: #00b4d8;
      font-size: 10px;
      font-family: 'Rajdhani', monospace;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
      pointer-events: none;
      z-index: 10;
      opacity: 0.85;
      background: rgba(4, 14, 30, 0.6);
      padding: 6px 18px;
      border-radius: 9999px;
      border: 1px solid rgba(0, 240, 255, 0.2);
      backdrop-filter: blur(8px);
    }
    .hud-hint span {
      color: #00f0ff;
      font-weight: bold;
    }

    #gesture-hud {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      font-family: 'Orbitron', monospace;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
    }
  </style>

  <script src="sagar_orb_libs/three.min.js"></script>
  <script src="sagar_orb_libs/OrbitControls.js"></script>
  <script src="sagar_orb_libs/EffectComposer.js"></script>
  <script src="sagar_orb_libs/RenderPass.js"></script>
  <script src="sagar_orb_libs/ShaderPass.js"></script>
  <script src="sagar_orb_libs/UnrealBloomPass.js"></script>
  <script src="sagar_orb_libs/CopyShader.js"></script>
  <script src="sagar_orb_libs/LuminosityHighPassShader.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="godseye-container">
    <iframe id="godseye-iframe" src="" allow="camera; microphone; geolocation; accelerometer; autoplay" allowfullscreen></iframe>
  </div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <!-- Top Status Bar & Dual-Mode UI Switcher -->
  <div class="top-hud">
    <div class="mode-switcher">
      <button class="mode-btn active" id="btn-orb" onclick="switchUIMode('orb')">🔮 QUANTUM ORB</button>
      <button class="mode-btn" id="btn-godseye" onclick="switchUIMode('godseye')">👁️ GOD'S EYE</button>
    </div>

    <div class="hud-title-wrap">
      <div class="hud-title" id="hud-main-title">J . A . R . V . I . S</div>
      <div class="hud-title-sub" id="hud-sub-title">QUANTUM CORE 3.8 // TACTICAL INTERFACE</div>
    </div>

    <div class="top-stats">
      <div class="stat-pill cyan" id="stat-mode-pill">ORB ACTIVE</div>
      <div class="stat-pill">802 TOOLS</div>
    </div>
  </div>

  <div id="gesture-hud">🖐️ AIR GESTURE READY</div>

  <div class="hud-hint">
    <div><span>DRAG</span> ROTATE</div>
    <div><span>SCROLL</span> ZOOM</div>
    <div><span>R</span> RESET</div>
  </div>

  <script>
    (function () {
      const container = document.getElementById("canvas-container");
      let width = container.clientWidth || window.innerWidth;
      let height = container.clientHeight || window.innerHeight;

      // ——— SCENE & CAMERA ———
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(55, width / height, 0.1, 300);
      const ORB_HOME = new THREE.Vector3(0, 0, 5.8);
      camera.position.copy(ORB_HOME);

      // ——— RENDERER ———
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        powerPreference: "high-performance",
        precision: "mediump"
      });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      container.appendChild(renderer.domElement);

      const composer = new THREE.EffectComposer(renderer);
      composer.addPass(new THREE.RenderPass(scene, camera));

      const bloom = new THREE.UnrealBloomPass(
        new THREE.Vector2(Math.floor(width / 2), Math.floor(height / 2)),
        1.7, 0.4, 0.2
      );
      composer.addPass(bloom);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.07;
      controls.minDistance = 1.0;
      controls.maxDistance = 35.0;
      controls.zoomSpeed = 1.2;
      controls.rotateSpeed = 0.8;
      controls.enablePan = false;

      // ——— PALETTES ———
      const C_CYAN   = 0x00f0ff;
      const C_BLUE   = 0x0099ff;
      const C_COBALT = 0x0055bb;
      const C_NAVY   = 0x002866;
      const C_GOLD   = 0xffd700;
      const C_WHITE  = 0xffffff;

      // =========================================================
      // 1. QUANTUM HOLOGRAPHIC ORB GROUP
      // =========================================================
      const orbGroup = new THREE.Group();
      scene.add(orbGroup);

      function lineMat(color, opacity = 1) {
        return new THREE.LineBasicMaterial({
          color: color,
          transparent: true,
          opacity: opacity,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
      }

      function latRing(radius, lat, segs = 80) {
        const r = radius * Math.cos(lat);
        const y = radius * Math.sin(lat);
        const pts = [];
        for (let i = 0; i <= segs; i++) {
          const a = (i / segs) * Math.PI * 2;
          pts.push(new THREE.Vector3(r * Math.cos(a), y, r * Math.sin(a)));
        }
        return new THREE.BufferGeometry().setFromPoints(pts);
      }

      function meridian(radius, lon, segs = 80) {
        const pts = [];
        for (let i = 0; i <= segs; i++) {
          const lat = (i / segs) * Math.PI - Math.PI / 2;
          pts.push(new THREE.Vector3(radius * Math.cos(lat) * Math.cos(lon), radius * Math.sin(lat), radius * Math.cos(lat) * Math.sin(lon)));
        }
        return new THREE.BufferGeometry().setFromPoints(pts);
      }

      // Outer Shell
      const outerShell = new THREE.Group();
      const R1 = 2.05;
      for (let i = -12; i <= 12; i++) {
        const lat = (i / 12) * (Math.PI / 2) * 0.95;
        const opacity = i % 3 === 0 ? 0.6 : 0.16;
        outerShell.add(new THREE.Line(latRing(R1, lat, 70), lineMat(i % 3 === 0 ? C_CYAN : C_NAVY, opacity)));
      }
      for (let i = 0; i < 20; i++) {
        const lon = (i / 20) * Math.PI * 2;
        const isMajor = i % 5 === 0;
        outerShell.add(new THREE.Line(meridian(R1, lon, 70), lineMat(isMajor ? C_CYAN : C_NAVY, isMajor ? 0.7 : 0.15)));
      }
      for (let i = 0; i < 4; i++) {
        const lon = (i / 4) * Math.PI * 2;
        for (let j = 0; j < 12; j++) {
          const t = (j / 11) * 2 - 1;
          const offset = (t * 0.22) / 2;
          const falloff = 1 - Math.abs(t) * 0.7;
          outerShell.add(new THREE.Line(meridian(R1, lon + offset, 80), lineMat(Math.abs(t) < 0.3 ? C_GOLD : C_CYAN, 0.9 * falloff)));
        }
      }
      orbGroup.add(outerShell);

      // Gyroscopic Shell
      const shell2 = new THREE.Group();
      const R2 = 2.18;
      for (let i = 0; i < 14; i++) {
        const lat = (Math.random() - 0.5) * Math.PI * 0.85;
        const startLon = Math.random() * Math.PI * 2;
        const arcLen = 0.5 + Math.random() * 1.2;
        const pts = [];
        const r = R2 * Math.cos(lat);
        const y = R2 * Math.sin(lat);
        for (let j = 0; j <= 40; j++) {
          const a = startLon + (j / 40) * arcLen;
          pts.push(new THREE.Vector3(r * Math.cos(a), y, r * Math.sin(a)));
        }
        shell2.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat(C_BLUE, 0.3 + Math.random() * 0.3)));
      }
      orbGroup.add(shell2);

      // Inner Geodesic Core
      const innerCore = new THREE.Group();
      const R3 = 0.95;
      for (let s = 0; s < 6; s++) {
        const pts = [];
        const turns = 3.5;
        const phase = (s / 6) * Math.PI * 2;
        for (let i = 0; i <= 180; i++) {
          const t = i / 180;
          const lat = t * Math.PI - Math.PI / 2;
          const lon = t * turns * Math.PI * 2 + phase;
          pts.push(new THREE.Vector3(R3 * Math.cos(lat) * Math.cos(lon), R3 * Math.sin(lat), R3 * Math.cos(lat) * Math.sin(lon)));
        }
        innerCore.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat(C_CYAN, 0.45 + Math.random() * 0.25)));
      }
      orbGroup.add(innerCore);

      // Arc Reactor Pulsing Core
      const icoGeo = new THREE.IcosahedronGeometry(0.3, 1);
      const icoWire = new THREE.LineSegments(new THREE.EdgesGeometry(icoGeo), lineMat(C_GOLD, 0.95));
      orbGroup.add(icoWire);

      const coreSphereMat = new THREE.MeshBasicMaterial({ color: C_GOLD, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending });
      const coreSphere = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), coreSphereMat);
      orbGroup.add(coreSphere);

      const glowSphereMat = new THREE.MeshBasicMaterial({ color: C_CYAN, transparent: true, opacity: 0.08, blending: THREE.AdditiveBlending });
      const glowSphere = new THREE.Mesh(new THREE.SphereGeometry(0.65, 16, 16), glowSphereMat);
      orbGroup.add(glowSphere);

      // Orb Telemetry Floating Sprites
      const orbSnippets = ["JARVIS.core", "ARC_REACTOR", "SYS.INIT", ">> MULTIMODAL", "ONLINE", "DWM_MIRROR", "QUANTUM", "GODS_EYE"];
      const orbTextures = orbSnippets.map((txt) => {
        const c = document.createElement("canvas");
        c.width = 192; c.height = 28;
        const ctx = c.getContext("2d");
        ctx.font = "bold 13px 'Courier New', monospace";
        ctx.fillStyle = "rgba(0, 240, 255, 0.9)";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(txt, 96, 14);
        return new THREE.CanvasTexture(c);
      });
      const orbTextOuter = new THREE.Group();
      for (let i = 0; i < 70; i++) {
        const mat = new THREE.SpriteMaterial({ map: orbTextures[i % orbTextures.length], transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
        const sp = new THREE.Sprite(mat);
        sp.scale.set(0.3, 0.05, 1);
        const phi = Math.acos(2 * Math.random() - 1);
        const theta = Math.random() * Math.PI * 2;
        const r = R1 + 0.05;
        sp.position.set(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
        sp.userData = { phi, theta, r, speed: (0.0004 + Math.random() * 0.0006) * (Math.random() > 0.5 ? 1 : -1) };
        orbTextOuter.add(sp);
      }
      orbGroup.add(orbTextOuter);

      // =========================================================
      // 2. UI MODE SWITCHER (QUANTUM ORB vs GOD'S EYE VIEW)
      // =========================================================
      let currentMode = "orb";

      window.switchUIMode = function (mode) {
        currentMode = (mode === "godseye" || mode === "eye" || mode === "god") ? "godseye" : "orb";
        const btnOrb = document.getElementById("btn-orb");
        const btnGodsEye = document.getElementById("btn-godseye");
        const modePill = document.getElementById("stat-mode-pill");
        const mainTitle = document.getElementById("hud-main-title");
        const subTitle = document.getElementById("hud-sub-title");
        const scanlineEl = document.querySelector(".scanlines");
        const canvasContainer = document.getElementById("canvas-container");
        const godseyeContainer = document.getElementById("godseye-container");
        const godseyeIframe = document.getElementById("godseye-iframe");

        if (btnOrb) btnOrb.classList.remove("active");
        if (btnGodsEye) btnGodsEye.classList.remove("active");

        if (currentMode === "godseye") {
          if (btnGodsEye) btnGodsEye.classList.add("active");
          if (canvasContainer) canvasContainer.style.display = "none";
          if (godseyeContainer) godseyeContainer.style.display = "block";
          if (scanlineEl) scanlineEl.style.display = "none";

          orbGroup.visible = false;
          if (modePill) {
            modePill.textContent = "GOD'S EYE ACTIVE";
            modePill.className = "stat-pill cyan";
          }
          if (mainTitle) mainTitle.textContent = "G O D ' S   E Y E";
          if (subTitle) subTitle.textContent = "GLOBAL SPY SATELLITE SIMULATOR // PHOTOREALISTIC EARTH RECON";

          if (godseyeIframe && (!godseyeIframe.src || godseyeIframe.src === "about:blank" || godseyeIframe.src === window.location.href)) {
            godseyeIframe.src = "http://127.0.0.1:5173/";
          }
        } else {
          if (btnOrb) btnOrb.classList.add("active");
          if (canvasContainer) canvasContainer.style.display = "block";
          if (godseyeContainer) godseyeContainer.style.display = "none";
          if (scanlineEl) scanlineEl.style.display = "block";

          orbGroup.visible = true;
          bloom.strength = 1.7;
          bloom.threshold = 0.2;

          if (modePill) {
            modePill.textContent = "ORB ACTIVE";
            modePill.className = "stat-pill cyan";
          }
          if (mainTitle) mainTitle.textContent = "J . A . R . V . I . S";
          if (subTitle) subTitle.textContent = "QUANTUM CORE 3.8 // TACTICAL INTERFACE";

          camera.position.copy(ORB_HOME);
          controls.target.set(0, 0, 0);
          controls.update();
        }
      };

      // External API bindings for Python
      window.setMode = window.switchUIMode;
      window.rotateBy = function (dt, dp) {
        if (currentMode === "orb") {
          orbGroup.rotation.y += dt;
          orbGroup.rotation.x += dp;
        }
      };
      window.zoomBy = function (factor) {
        if (currentMode === "orb") {
          camera.position.multiplyScalar(factor);
          controls.update();
        }
      };
      window.resetView = function () {
        if (currentMode === "orb") {
          camera.position.copy(ORB_HOME);
          controls.target.set(0, 0, 0);
          controls.update();
        }
      };
      window.setGestureStatus = function (msg, isError) {
        const el = document.getElementById("gesture-hud");
        if (!el) return;
        el.textContent = msg;
        el.style.opacity = "1";
        el.style.borderColor = isError ? "rgba(255, 50, 70, 0.6)" : "rgba(0, 240, 255, 0.4)";
        el.style.color = isError ? "#ff5566" : "#00f0ff";
        clearTimeout(window._gestureTimer);
        window._gestureTimer = setTimeout(() => {
          el.style.opacity = "0";
        }, 3000);
      };

      // ——— ANIMATION LOOP ———
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        if (currentMode === "orb") {
          outerShell.rotation.y += 0.0018;
          shell2.rotation.y -= 0.0014;
          innerCore.rotation.y -= 0.006;
          icoWire.rotation.x += 0.01;
          icoWire.rotation.y += 0.015;

          const surge = Math.pow(Math.max(0, Math.sin(t * 0.4)), 5) * 1.5;
          coreSphere.scale.setScalar(1 + surge + Math.sin(t * 5) * 0.05);
          glowSphere.scale.setScalar(1 + surge * 0.7);

          orbTextOuter.children.forEach((sp) => {
            sp.userData.theta += sp.userData.speed;
            sp.position.set(
              sp.userData.r * Math.sin(sp.userData.phi) * Math.cos(sp.userData.theta),
              sp.userData.r * Math.cos(sp.userData.phi),
              sp.userData.r * Math.sin(sp.userData.phi) * Math.sin(sp.userData.theta)
            );
          });

          controls.update();
          composer.render();
        }
      }

      animate();

      try {
        const urlParams = new URLSearchParams(window.location.search);
        const m = urlParams.get("mode");
        if (m === "godseye" || m === "eye" || m === "god") {
          window.switchUIMode("godseye");
        }
      } catch (err) {
        console.warn("Mode param parse note:", err);
      }

      // Keyboard R Reset
      window.addEventListener("keydown", function (e) {
        if (e.key === "r" || e.key === "R") window.resetView();
      });

      // Resize
      window.addEventListener("resize", function () {
        width = container.clientWidth || window.innerWidth;
        height = container.clientHeight || window.innerHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
        composer.setSize(width, height);
        bloom.setSize(Math.floor(width / 2), Math.floor(height / 2));
      });
    })();
  </script>
</body>
</html>
