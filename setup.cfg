[metadata]
name = friday_neural_os
version = 0.1.7
author = Shivansh Pancholi
author_email = shivamogh.12@gmail.com
description = A real-time AI assistant with tools, memory, and voice
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
classifiers =
    Programming Language :: Python :: 3
    Operating System :: Microsoft :: Windows

[options]
packages = find:
python_requires = >=3.9
install_requires =
    python-dotenv
    requests
    psutil
    pillow
    opencv-python
    livekit-agents
    livekit-plugins-silero
    livekit-plugins-google
    livekit-plugins-noise-cancellation
    mem0ai
    duckduckgo-search
    langchain_community
    google-genai
    pyautogui
    truecallerpy
    phonenumbers
    opencage
    folium
    pywebostv
    pywin32; platform_system=="Windows"
    win10toast; platform_system=="Windows"
    screen-brightness-control; platform_system=="Windows"

[options.extras_require]
hacking =
    scapy
    impacket
    adb

[options.entry_points]
console_scripts =
    friday-run=friday.cli:main
    friday=friday.cli:main
